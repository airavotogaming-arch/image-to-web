name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install desktop packaging tools
        run: npm install --no-save --package-lock=false --no-audit --no-fund electron@38 electron-builder@26

      - name: Build web application
        run: npm run build

      - name: Prepare desktop package metadata
        run: npm pkg set version=1.0.0 main=desktop/main.cjs description="Airavoto Gaming POS for gaming center management"

      - name: Build macOS DMG
        run: npx electron-builder --config electron-builder.yml --mac dmg --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: airavoto-macos-dmg-${{ matrix.arch }}
          path: release/*.dmg
          if-no-files-found: error
          retention-days: 14
